# Runs the Go micro-benchmarks under CodSpeed, which tracks them per commit
# and reports regressions on pull requests.
name: codspeed
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  benchmarks:
    # Walltime is the only instrument CodSpeed supports for Go. A shared
    # runner is noisy; switch to a CodSpeed macro runner (for example
    # codspeed-macro) once the organization has them for stable numbers.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # CodSpeed authenticates the upload with the job's OIDC token.
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: Run benchmarks
      uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
      with:
        mode: walltime
        run: go test -bench=. ./cmd/ateapi/internal/scheduling/ ./internal/protoredact/ ./internal/contextlogging/
